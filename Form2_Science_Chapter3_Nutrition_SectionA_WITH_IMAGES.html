const Q=[{"q": "Food sample P gives a brick-red precipitate with Benedict's solution after heating, remains brown with iodine solution, and remains blue with Biuret reagent. Which nutrient is present?", "o": ["Starch", "Glucose", "Protein", "Fat"], "a": 1, "en": "Benedict's test gives a brick-red precipitate when reducing sugar such as glucose is present.", "zh": "本尼迪特试验出现砖红色沉淀，表示含有还原糖，例如葡萄糖。"}, {"q": "Four students consume the same amount of food each day. Who is most likely to require the highest energy intake?", "o": ["A clerk in an air-conditioned office", "A student studying for an examination", "A construction worker doing heavy physical work", "A person resting at home"], "a": 2, "en": "Heavy physical activity increases energy requirement.", "zh": "重体力活动会提高能量需求。"}, {"q": "A meal contains 65 g carbohydrate, 20 g protein and 15 g fat. Given carbohydrate = 17 kJ g⁻¹, protein = 17 kJ g⁻¹ and fat = 37 kJ g⁻¹, calculate the total energy value.", "o": ["1 445 kJ", "1 660 kJ", "2 000 kJ", "2 340 kJ"], "a": 2, "en": "(65×17)+(20×17)+(15×37)=2000 kJ.", "zh": "计算结果为 2000 kJ。"}, {"q": "A student eats enough carbohydrate and protein but rarely consumes fruits and vegetables. Which problem is most likely?", "o": ["Scurvy and constipation", "Obesity and diabetes only", "Rickets and excessive growth", "Excessive production of red blood cells"], "a": 0, "en": "Low fruit and vegetable intake may reduce vitamin C and fibre intake.", "zh": "蔬果不足可能导致维生素C和膳食纤维摄取不足。"}, {"q": "Which combination correctly matches a nutrient with its main function?", "o": ["Protein → main immediate energy source", "Carbohydrate → growth and repair", "Fat → heat insulation and energy storage", "Fibre → formation of new body cells"], "a": 2, "en": "Fat stores energy and provides thermal insulation.", "zh": "脂肪能储存能量并帮助保温。"}, {"q": "Bread turns blue-black with iodine. After being mixed with saliva and kept at body temperature, it no longer turns blue-black. Why?", "o": ["Saliva converts glucose into starch", "Amylase breaks down starch into simpler sugar", "Protease breaks down starch into amino acids", "Lipase emulsifies starch"], "a": 1, "en": "Salivary amylase digests starch into simpler sugars.", "zh": "唾液淀粉酶把淀粉分解成较简单的糖。"}, {"q": "Which sequence shows the correct movement of food through the alimentary canal?", "o": ["Mouth → oesophagus → stomach → small intestine → large intestine → anus", "Mouth → stomach → oesophagus → small intestine → large intestine → anus", "Mouth → oesophagus → liver → stomach → small intestine → anus", "Mouth → pancreas → stomach → small intestine → large intestine → anus"], "a": 0, "en": "Food passes through mouth, oesophagus, stomach, small intestine, large intestine and anus.", "zh": "正确顺序为口腔、食道、胃、小肠、大肠、肛门。"}, {"q": "What happens during physical digestion?", "o": ["Large food particles become smaller without changing chemical composition", "Complex molecules become soluble molecules by enzymes", "Nutrients diffuse from blood into the small intestine", "Food molecules are oxidised to release energy"], "a": 0, "en": "Physical digestion changes particle size, not chemical composition.", "zh": "物理消化只改变食物大小，不改变化学组成。"}, {"q": "Which statement correctly describes the function of bile?", "o": ["Digests protein into amino acids", "Converts starch directly into glucose", "Emulsifies fat and helps neutralise acidic chyme", "Converts fatty acids into fat"], "a": 2, "en": "Bile emulsifies fat and helps neutralise acidic chyme.", "zh": "胆汁乳化脂肪，并帮助中和酸性食糜。"}, {"q": "A blockage prevents pancreatic juice from entering the duodenum. Digestion of which nutrients will be directly affected?", "o": ["Carbohydrate only", "Protein only", "Fat only", "Carbohydrate, protein and fat"], "a": 3, "en": "Pancreatic juice contains enzymes for carbohydrate, protein and fat digestion.", "zh": "胰液含有参与三类营养物消化的酶。"}, {"q": "What is the final product of protein digestion?", "o": ["Glucose", "Amino acids", "Fatty acids", "Glycerol"], "a": 1, "en": "Proteins are finally digested into amino acids.", "zh": "蛋白质最终被消化成氨基酸。"}, {"q": "Visking tubing containing glucose and starch solution is immersed in distilled water. Later, glucose is detected outside but starch is not. What does this show?", "o": ["Only water can cross", "Large molecules diffuse faster", "Small soluble molecules can pass through a selectively permeable membrane", "The tubing converts starch into glucose"], "a": 2, "en": "Small glucose molecules can cross the selectively permeable membrane; starch cannot.", "zh": "小葡萄糖分子能通过选择透过性膜，大淀粉分子不能。"}, {"q": "Why does the small intestine contain many villi?", "o": ["To reduce food movement", "To increase surface area for absorption", "To store undigested food", "To produce faeces"], "a": 1, "en": "Villi increase surface area for absorption.", "zh": "绒毛增加吸收表面积。"}, {"q": "After glucose is absorbed through the villi, which system mainly transports it to body cells?", "o": ["Digestive system", "Circulatory system", "Skeletal system", "Excretory system"], "a": 1, "en": "Absorbed glucose is transported in blood by the circulatory system.", "zh": "葡萄糖被吸收后由循环系统通过血液运输。"}, {"q": "How do the digestive, circulatory and respiratory systems work together?", "o": ["Digestion produces oxygen", "Digested nutrients and oxygen are transported to cells where respiration releases energy", "The respiratory system digests glucose", "The circulatory system converts food into oxygen"], "a": 1, "en": "Nutrients and oxygen are transported to cells for cellular respiration.", "zh": "营养物和氧气被运到细胞进行细胞呼吸。"}, {"q": "P consumes 9 500 kJ and requires 9 500 kJ; Q consumes 11 200 kJ and requires 8 900 kJ; R consumes 7 600 kJ and requires 9 100 kJ. Which statement is most accurate?", "o": ["P is most likely to gain weight continuously", "Q has an energy surplus that may be stored", "R has excess energy for storage", "All three have balanced energy intake"], "a": 1, "en": "Q has a 2300 kJ energy surplus, which may be stored.", "zh": "Q 的能量摄取比需求多 2300 kJ，过剩能量可能被储存。"}, {"q": "A teenager consumes much more energy than required every day while doing little physical activity. What is the most likely long-term effect?", "o": ["Body mass may increase because excess energy is stored", "All excess nutrients are immediately excreted", "Body temperature permanently decreases", "Digestion stops"], "a": 0, "en": "Persistent energy surplus can increase body mass.", "zh": "长期能量过剩可能使体重增加。"}, {"q": "Most remaining water and dissolved mineral salts are reabsorbed in the", "o": ["stomach", "duodenum", "large intestine", "rectum"], "a": 2, "en": "The large intestine reabsorbs much of the remaining water and mineral salts.", "zh": "大肠重新吸收剩余的大部分水分和矿物盐。"}, {"q": "A student consumes very little fibre and insufficient water for several weeks. What is most likely?", "o": ["Diarrhoea", "Constipation because faeces become difficult to pass", "Increased protein absorption in the stomach", "Faster fat digestion in the large intestine"], "a": 1, "en": "Insufficient fibre and water can cause hard faeces and constipation.", "zh": "纤维和水分不足可使粪便变硬并导致便秘。"}, {"q": "A student says, “A balanced diet means eating the same quantity from every food class.” Which evaluation is correct?", "o": ["Correct because every nutrient is needed equally", "Correct only for active people", "Incorrect because nutrients are needed in suitable proportions according to individual needs", "Incorrect because carbohydrate and fat should never be included"], "a": 2, "en": "A balanced diet supplies nutrients in suitable proportions according to individual needs.", "zh": "均衡饮食是按个人需要以适当比例摄取各种营养。"}],quiz=document.getElementById('quiz'),btn=document.getElementById('submit'),status=document.getElementById('status'),result=document.getElementById('result');

Q.forEach((x,i)=>{let d=document.createElement('section');d.className='q';let pic=IMAGES[String(i+1)]?`<img class="qimg" src="${IMAGES[String(i+1)]}" alt="Question ${i+1} science diagram">`:'';d.innerHTML=`<h3>${i+1}. ${x.q}</h3>${pic}${x.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="fb" id="f${i}"></div>`;quiz.appendChild(d)});
document.onchange=()=>{let n=Q.filter((_,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;status.textContent=`Answered: ${n} / 20`;btn.textContent=`Submit Answers (${n}/20)`;btn.disabled=n<20};
btn.onclick=()=>{let c=0,w=[];Q.forEach((x,i)=>{let p=+document.querySelector(`input[name=q${i}]:checked`).value,f=document.getElementById('f'+i);f.style.display='block';if(p===x.a){c++;f.className='fb ok';f.innerHTML=`<b>Correct</b><br>${x.en}<br><b>华语解释：</b>${x.zh}`}else{w.push(i+1);f.className='fb bad';f.innerHTML=`<b>Incorrect</b><br>Your answer: ${String.fromCharCode(65+p)}. ${x.o[p]}<br><b>Correct Answer: ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</b><br>${x.en}<br><b>华语解释：</b>${x.zh}`}});result.style.display='block';result.innerHTML=`<h2>Final Result</h2><p>Total Questions: <b>20</b></p><p>Correct: <b>${c}</b></p><p>Incorrect: <b>${20-c}</b></p><p>Score: <b>${c*5}/100</b></p><p>Wrong Questions: <b>${w.length?w.join(', '):'None'}</b></p>`;document.querySelectorAll('input').forEach(e=>e.disabled=true);btn.disabled=true;result.scrollIntoView({behavior:'smooth'})};
</script></body></html>
