name: Extract Set 4

on:
  push:
    paths:
      - 'patch-trigger.txt'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build text-only exam source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          s=re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+','[IMG]',s)
          s=re.sub(r'([{};,])',r'\1\n',s)
          Path('exam-text-source.txt').write_text(s,encoding='utf-8')
          PY
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-text-source.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add text-only exam source for review [skip ci]"
          git push
