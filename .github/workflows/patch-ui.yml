name: Implant Set 5 visuals
on:
  push:
    paths:
      - 'patch-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map Set 5 question visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          line='const SET5_VISUALS={"1":"assets/set5-q1.jpg","2":"assets/set5-q2.jpg","3":"assets/set5-q3.jpg","5":"assets/set5-q5.jpg","7":"assets/set5-q7.jpg"};'
          if 'const SET5_VISUALS=' not in s:
              if '</body>' not in s: raise SystemExit('body marker missing')
              s=s.replace('</body>','<script>'+line+'</script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Set 5 mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Map Set 5 question visuals [skip ci]"
          git push
