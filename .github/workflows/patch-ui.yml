name: Integrate Set 4 batch 4 visuals
on:
  push:
    paths:
      - 'patch-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode visuals and patch Set 4
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          Path('assets').mkdir(exist_ok=True)
          for q in (17,18,19):
              src=Path(f'tmp/set4-q{q}.b64')
              Path(f'assets/set4-q{q}.jpg').write_bytes(base64.b64decode(src.read_text().strip()))
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          new='const SET4_VISUALS={"2":"assets/set4-q2.jpg","4":"assets/set4-q4.jpg","5":"assets/set4-q5.jpg","7":"assets/set4-q7.jpg","11":"assets/set4-q11.svg","12":"assets/set4-q12.svg","13":"assets/set4-q13.svg","14":"assets/set4-q14.svg","15":"assets/set4-q15.svg","16":"assets/set4-q16.svg","17":"assets/set4-q17.jpg","18":"assets/set4-q18.jpg","19":"assets/set4-q19.jpg"};'
          if 'const SET4_VISUALS=' not in s: raise SystemExit('SET4_VISUALS not found')
          s,n=re.subn(r'const SET4_VISUALS=\{.*?\};',new,s,count=1)
          if n!=1: raise SystemExit('Set 4 visual map patch failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/set4-q17.jpg assets/set4-q18.jpg assets/set4-q19.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add Set 4 batch 4 question visuals [skip ci]"
          git push
