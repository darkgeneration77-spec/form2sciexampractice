name: Inspect image integration
on:
  push:
    paths:
      - 'patch-trigger.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract image and renderer contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          # Remove large image payloads but preserve attribute/property surroundings.
          t=re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+','[IMG]',s)
          out=[]
          for i,m in enumerate(re.finditer(r'\[IMG\]',t)):
              if i>=8: break
              out.append('\n===== IMG %d =====\n'% (i+1))
              out.append(t[max(0,m.start()-700):min(len(t),m.end()+700)])
          out.append('\n===== SCRIPT TAIL =====\n')
          out.append(t[-30000:])
          Path('image-integration-context.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-integration-context.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add image integration context [skip ci]"
          git push
