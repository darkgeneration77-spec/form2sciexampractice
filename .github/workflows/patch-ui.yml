name: Inspect visual integration
on:
  push:
    paths:
      - 'patch-trigger.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract visual integration context
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['SET4_VISUALS','set4-q','visualMap','question-visual','questionVisual','visual']
          chunks=[]
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  chunks.append(f'===== {needle} @ {i} =====\n'+s[max(0,i-1000):i+1800])
                  start=i+len(needle)
                  if len(chunks)>=20: break
          Path('visual-integration-inspect.txt').write_text('\n\n'.join(chunks),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-integration-inspect.txt
          git diff --cached --quiet && exit 0
          git commit -m "Inspect visual integration context [skip ci]"
          git push
