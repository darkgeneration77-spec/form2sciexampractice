name: Extract Set 4

on:
  push:
    paths:
      - 'patch-trigger.txt'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Set 4 context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          hits=list(re.finditer(r'(?i)set\s*4',s))
          out=[]
          out.append(f'Found {len(hits)} occurrences of Set 4\n')
          for i,m in enumerate(hits[:20],1):
              a=max(0,m.start()-12000)
              b=min(len(s),m.end()+50000)
              out.append(f'\n===== OCCURRENCE {i} @ {m.start()} =====\n')
              out.append(s[a:b])
          Path('set4-extract.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add set4-extract.txt
          git diff --cached --quiet && exit 0
          git commit -m "Extract Set 4 question context [skip ci]"
          git push
