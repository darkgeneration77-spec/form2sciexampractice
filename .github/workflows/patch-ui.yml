name: Integrate Set 4 batch 2 visuals
on:
  push:
    paths:
      - 'patch-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Set 4 visual map
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          new='const SET4_VISUALS={"2":"assets/set4-q2.jpg","4":"assets/set4-q4.jpg","5":"assets/set4-q5.jpg","7":"assets/set4-q7.jpg","11":"assets/set4-q11.svg","12":"assets/set4-q12.svg","13":"assets/set4-q13.svg"};'
          if 'const SET4_VISUALS=' not in s:
              raise SystemExit('SET4_VISUALS not found')
          s,n=re.subn(r'const SET4_VISUALS=\{.*?\};',new,s,count=1)
          if n!=1: raise SystemExit('Set 4 visual map patch failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/set4-q11.svg assets/set4-q12.svg assets/set4-q13.svg
          git diff --cached --quiet && exit 0
          git commit -m "Add Set 4 batch 2 question visuals [skip ci]"
          git push
