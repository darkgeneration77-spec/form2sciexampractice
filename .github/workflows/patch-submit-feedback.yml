name: Patch submit-only bilingual feedback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, json

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          cn = {
          "The answer follows the behaviour of series or parallel circuits and electromagnets.":"串联电路只有一条电流路径；并联电路各支路有独立路径。电磁铁的强弱则与线圈匝数、电流等因素有关。",
          "The term is identified from the stated property or behaviour.":"根据题目给出的性质或现象来辨认正确的科学术语。",
          "A spider is classified as a arachnid based on characteristics such as 4 pairs of legs.":"蜘蛛属于蛛形纲，因为它具有四对足等特征。",
          "Protection in the natural habitat is in-situ, while a seed bank is ex-situ.":"在生物原本的自然栖息地进行保护属于原地保护（in-situ）；种子库是在自然栖息地以外保存，因此属于迁地保护（ex-situ）。",
          "The interaction is identified by whether each organism benefits, is harmed or competes for the same resource.":"判断生物之间的关系时，要看双方是否受益、受害，或是否争夺相同的资源。",
          "Pressure depends on force and contact area, while stability generally improves with a lower centre of gravity and wider base.":"压强取决于作用力和接触面积。相同作用力下，接触面积越小，压强越大；较低的重心和较宽的底面通常能提高稳定性。",
          "Each water-treatment stage has a specific function.":"水处理的每一个步骤都有特定作用，例如去除大型杂物、让悬浮颗粒沉淀、过滤细小杂质及消毒。",
          "A pH of 4 indicates a acidic solution.":"pH 4 小于 7，因此该溶液属于酸性溶液。",
          "Sound is produced by vibrations; loudness is related to amplitude and pitch to frequency.":"声音由振动产生。响度与振幅有关，而音调高低与频率有关。频率越高，音调越高。",
          "The answer follows thermal expansion, convection and radiation principles.":"这题需要应用热胀冷缩、对流或热辐射的原理来判断现象。",
          "Sound is a mechanical wave; its behaviour depends on the medium and on reflection or absorption.":"声音属于机械波，需要介质传播，并会发生反射或被材料吸收。",
          "The answer follows the basic rules of charge and electrical measurement.":"这题应用电荷及电学测量的基本规律。电流用安培计测量，电势差用伏特计测量。",
          "Heat may be transferred by conduction, convection or radiation. At thermal equilibrium there is no net heat flow.":"热可以通过传导、对流或辐射传递。当两个物体达到热平衡时，两者之间没有净热量传递。",
          "Indicators show characteristic colours, and acid-alkali neutralisation produces salt and water.":"酸碱指示剂在不同性质的溶液中会呈现特定颜色；酸和碱发生中和反应会生成盐和水。",
          "For opposite forces, subtract the smaller force from the larger one. The larger force gives the direction.":"两个力方向相反时，用较大的力减去较小的力；合力方向跟随较大的力。",
          "The observation matches the standard food test for this nutrient.":"根据标准食物检验出现的颜色或现象，可以判断食物中所含的营养素。",
          "With fewer birds, fewer caterpillars are eaten, so the caterpillar population is likely to increase.":"鸟的数量减少后，被鸟捕食的毛毛虫减少，因此毛毛虫的数量可能增加。",
          "Protein is required for growth and repair of body tissues.":"蛋白质是身体生长以及修复受损组织所需要的重要营养素。",
          "Tuberculosis is caused by a bacterium.":"结核病（tuberculosis）是由细菌引起的传染病。",
          "Respiratory infections spread through droplets and close contact, so cough hygiene and ventilation reduce transmission.":"呼吸道感染可通过飞沫及近距离接触传播，因此遮掩咳嗽、保持通风和减少密切接触可以降低传播风险。",
          "The best prevention method targets the relevant transmission route or improves specific immunity.":"预防传染病时，应针对它实际的传播途径采取措施，或通过特定免疫方式提高保护能力。",
          "For the same force, a smaller contact area produces greater pressure.":"在作用力相同的情况下，接触面积越小，产生的压强越大。",
          "In a parallel circuit, each branch provides an independent path for current.":"并联电路的每一条支路都有独立的电流路径，因此其中一条支路断开时，其他完整支路仍可工作。",
          "A lizard is classified as a reptile based on characteristics such as dry scaly skin.":"蜥蜴属于爬行动物，因为它具有干燥、有鳞片的皮肤等特征。",
          "Malaria is caused by a protozoan.":"疟疾（malaria）是由原生动物（protozoan）引起的。",
          "Large debris is removed first, heavier particles settle, fine particles are filtered, and disinfection is carried out near the end.":"水处理时先去除大型杂物，再让较重颗粒沉淀，之后过滤细小颗粒，并在后段进行消毒。",
          "In-situ conservation protects organisms in their natural habitat, whereas ex-situ conservation protects them outside it.":"原地保护（in-situ）是在生物的自然栖息地保护它们；迁地保护（ex-situ）则是在自然栖息地之外进行保护。",
          "Acids turn blue litmus red, while alkalis turn red litmus blue.":"酸会使蓝色石蕊试纸变红；碱会使红色石蕊试纸变蓝。",
          "Fewer rabbits feed on the grass, so its population is likely to increase.":"兔子的数量减少后，吃草的兔子也减少，因此草的数量可能增加。",
          "A pH of 12 indicates an alkaline solution.":"pH 12 大于 7，因此该溶液属于碱性溶液。",
          "Each nutrient has a specific major function in maintaining health.":"不同营养素在人体中具有不同的主要功能，例如供给能量、生长与修复组织或维持健康。",
          "Ringworm is caused by a fungus.":"癣（ringworm）是由真菌（fungus）引起的。",
          "A pH of 7 indicates a neutral solution.":"pH 7 表示该溶液呈中性。",
          "Dull black surfaces are better absorbers of thermal radiation.":"暗黑色、无光泽的表面比浅色或有光泽的表面更容易吸收热辐射。",
          "A butterfly is classified as an insect based on characteristics such as 3 pairs of legs.":"蝴蝶属于昆虫，因为昆虫具有三对足等特征。",
          "With fewer frogs, fewer grasshoppers are eaten, so the grasshopper population is likely to increase.":"青蛙数量减少后，被捕食的蚱蜢减少，因此蚱蜢数量可能增加。",
          "Insects have three pairs of legs, while arachnids have four pairs.":"昆虫有三对足，而蛛形纲动物有四对足。",
          "Higher frequency corresponds to higher pitch.":"声音的频率越高，音调越高；频率越低，音调越低。"
          }

          if 'const CN_EXPLANATIONS=' not in html:
              pos = html.index('function load()')
              html = html[:pos] + 'const CN_EXPLANATIONS=' + json.dumps(cn, ensure_ascii=False) + ';\n' + html[pos:]

          start = html.index('function render(){')
          end = html.index('function renderPal()', start)
          new_render = r'''function render(){
            load();
            document.getElementById('setLabel').textContent=`Set ${current+1}`;
            let box=document.getElementById('questions');box.innerHTML='';
            let pal=document.getElementById('palette');pal.innerHTML='';
            SETS[current].forEach((it,i)=>{
              let chosen=state[i]?.chosen,checked=state[i]?.checked,opts='';
              it.options.forEach((op,oi)=>{
                let cls='option';
                if(checked){if(oi===it.answer)cls+=' correct';else if(oi===chosen)cls+=' wrong'}
                opts+=`<label class="${cls}"><input type="radio" name="q${i}" value="${oi}" ${chosen===oi?'checked':''} ${checked?'disabled':''}><span><b>${String.fromCharCode(65+oi)}.</b> ${op}</span></label>`;
              });
              let fb='';
              if(checked && chosen!==it.answer){
                const zh=CN_EXPLANATIONS[it.explanation] || `正确答案是 ${String.fromCharCode(65+it.answer)}. ${it.options[it.answer]}。本题考查 Chapter ${it.chapter}：${it.topic}。请根据题目关键词和相关科学概念重新判断。`;
                fb=`<div class="feedback bad"><div><b>Correct answer:</b> ${String.fromCharCode(65+it.answer)}. ${it.options[it.answer]}</div><div style="margin-top:8px"><b>English explanation:</b> ${it.explanation}</div><div style="margin-top:8px"><b>华语解释：</b>${zh}</div><small style="display:block;margin-top:8px">Chapter ${it.chapter} · ${it.topic}</small></div>`;
              }else if(checked && chosen===it.answer){
                fb=`<div class="feedback ok"><span class="tag">${msg(praise,i)}</span> Correct.</div>`;
              }else fb='<div class="feedback"></div>';
              let c=document.createElement('div');c.className='qcard';c.id='q'+i;
              c.innerHTML=`<div class="qnum">Question ${i+1}</div><div class="stem">${it.stem}</div>${((current===0?SET1_VISUALS:(current===1?SET2_VISUALS:(current===2?SET3_VISUALS:{})))[String(i+1)])?`<div class="qvisual"><img src="${(current===0?SET1_VISUALS:(current===1?SET2_VISUALS:SET3_VISUALS))[String(i+1)]}" alt="Question ${i+1} visual"></div>`:""}${opts}${fb}`;
              box.appendChild(c);
              let p=document.createElement('div');p.className='pill';p.textContent=i+1;
              if(checked)p.classList.add(chosen===it.answer?'right':'wrong');else if(chosen!==undefined)p.classList.add('done');
              p.onclick=()=>document.getElementById('q'+i).scrollIntoView({behavior:'smooth',block:'center'});
              pal.appendChild(p);
            });
            document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=e=>{
              let i=+e.target.name.slice(1);state[i]=state[i]||{};state[i].chosen=+e.target.value;save();update();renderPal();
            });
            update();
          }
          '''
          html = html[:start] + new_render + html[end:]
          html = re.sub(r'function checkOne\(i\)\{.*?\}\nfunction update\(\)\{', 'function update(){', html, count=1, flags=re.S)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patched site
        shell: bash
        run: |
          rm -f .github/workflows/patch-submit-feedback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use submit-only grading with bilingual feedback [skip ci]"
          git push
